; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_SUPPRESS_DEFINE_CHECK
    -D LV_USE_DRAW_SW_ASM=0
    -I include
    ; TFT_eSPI Configuration
    -D USER_SETUP_LOADED=1
    -D TFT_SPI_PORT=1
    -D ILI9488_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=11
    -D TFT_SCLK=10
    -D TFT_CS=15
    -D TFT_DC=13
    -D TFT_RST=14
    -D TFT_BL=16
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D TOUCH_SDA=0
    -D TOUCH_SCL=1
    -D TOUCH_INT=2
    -D TOUCH_RST=3
    -D ROT_CLK=20
    -D ROT_DT=21
    -D ROT_SW=22

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_SUPPRESS_DEFINE_CHECK
    -D LV_USE_DRAW_SW_ASM=0
    -I include
    ; ESP32-S3 Pinout (Example)
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=46
    -D TFT_BL=3
    -D TOUCH_CS=-1
    -D TOUCH_SDA=8
    -D TOUCH_SCL=9
    -D TOUCH_INT=-1
    -D TOUCH_RST=-1
    -D ROT_CLK=-1
    -D ROT_DT=-1
    -D ROT_SW=-1
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=27000000
    -D TFT_RGB_ORDER=TFT_BGR


upload_port = COM15